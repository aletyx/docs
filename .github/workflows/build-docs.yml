name: Build docs

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Include Draft pages from Notion"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: scripts/build-site.sh ${{ inputs.preview && '--preview' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: blume-docs-site
          path: dist/
          retention-days: 14
