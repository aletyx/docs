version: "0.5"

processes:
  blume-dev:
    description: "Blume local docs dev server (content from Notion)"
    # scripts/dev.sh loads the Notion settings from the environment or .env / .env.local.
    command: "scripts/dev.sh"
    working_dir: "."
    availability:
      restart: "always"
      backoff_seconds: 2
    readiness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: http
        path: "/docs"
        port: 4321
      initial_delay_seconds: 5
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 180  # 15 min: a cold start fetches every Notion page first
